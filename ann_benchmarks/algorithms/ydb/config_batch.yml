float:
  any:
  - base_args: ['@metric']
    constructor: YDBVector
    disabled: false
    docker_tag: ann-benchmarks-ydb
    module: ann_benchmarks.algorithms.ydb
    name: ydb
    run_groups:
      C50-l3-o3:
        arg_groups: [{clusters: 50, levels: 3, overlap_clusters: 3, index_count: 1}]
        args: {}
        query_args:
          - [{threads: 1}]
          - [{threads: 2}]
          - [{threads: 4}]
          - [{threads: 8}]
          - [{threads: 16}]
          - [{threads: 32}]
          - [{threads: 64}]
          - [{threads: 128}]
